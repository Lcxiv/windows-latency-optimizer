name: tests

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PESTER_VERSION: '3.4.0'
  PSSA_VERSION: '1.21.0'

jobs:
  ps-parse-check:
    name: PowerShell parse-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check all .ps1 + .wprp
        shell: pwsh
        run: ./scripts/test-all.ps1

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PSScriptAnalyzer module
        id: pssa-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\Documents\WindowsPowerShell\Modules\PSScriptAnalyzer\${{ env.PSSA_VERSION }}
            C:\Users\runneradmin\Documents\PowerShell\Modules\PSScriptAnalyzer\${{ env.PSSA_VERSION }}
          key: pssa-${{ runner.os }}-${{ env.PSSA_VERSION }}

      - name: Install PSScriptAnalyzer
        if: steps.pssa-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber

      - name: Lint scripts/ (Error severity gates CI)
        shell: powershell
        run: ./scripts/lint-all.ps1 -Errors_Only

  pester:
    name: Pester
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pester module
        id: pester-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\Documents\WindowsPowerShell\Modules\Pester\${{ env.PESTER_VERSION }}
            C:\Users\runneradmin\Documents\PowerShell\Modules\Pester\${{ env.PESTER_VERSION }}
          key: pester-${{ runner.os }}-${{ env.PESTER_VERSION }}

      - name: Install Pester (project surface uses v3 syntax — runner has v5)
        if: steps.pester-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: Install-Module -Name Pester -RequiredVersion $env:PESTER_VERSION -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber

      - name: Run tests/ suite
        shell: powershell
        run: |
          # Each step is a fresh process — must re-evict any pre-loaded v5 and import pinned v3.
          Get-Module -Name Pester | Remove-Module -Force -ErrorAction SilentlyContinue
          Import-Module -Name Pester -RequiredVersion $env:PESTER_VERSION -Force
          $loaded = Get-Module -Name Pester
          Write-Host ("Loaded Pester version: {0}" -f $loaded.Version)
          if ($loaded.Version.ToString() -ne $env:PESTER_VERSION) {
            throw ("Wrong Pester version loaded: {0} (wanted {1})" -f $loaded.Version, $env:PESTER_VERSION)
          }

          $r = Invoke-Pester -Path tests -PassThru -OutputFile pester-tests.xml -OutputFormat NUnitXml
          Write-Host ("Passed: {0} / Failed: {1} / Skipped: {2} / Total: {3}" -f $r.PassedCount, $r.FailedCount, $r.SkippedCount, $r.TotalCount)
          if ($r.FailedCount -gt 0) {
            Write-Host '---FAILED TESTS---'
            $r.TestResult | Where-Object { $_.Result -ne 'Passed' } | ForEach-Object {
              Write-Host ("FAIL: {0} > {1} > {2}" -f $_.Describe, $_.Context, $_.Name)
              Write-Host ("  {0}" -f $_.FailureMessage)
            }
            exit 1
          }

      - name: Run spike Pester (if branch carries spike/)
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path 'spike/tests')) { Write-Host 'spike/ not present — skipping'; exit 0 }
          Get-Module -Name Pester | Remove-Module -Force -ErrorAction SilentlyContinue
          Import-Module -Name Pester -RequiredVersion $env:PESTER_VERSION -Force

          $r = Invoke-Pester -Path spike/tests -PassThru -OutputFile pester-spike.xml -OutputFormat NUnitXml
          Write-Host ("Spike Passed: {0} / Failed: {1} / Skipped: {2} / Total: {3}" -f $r.PassedCount, $r.FailedCount, $r.SkippedCount, $r.TotalCount)
          if ($r.FailedCount -gt 0) {
            Write-Host '---FAILED SPIKE TESTS---'
            $r.TestResult | Where-Object { $_.Result -ne 'Passed' } | ForEach-Object {
              Write-Host ("FAIL: {0} > {1} > {2}" -f $_.Describe, $_.Context, $_.Name)
              Write-Host ("  {0}" -f $_.FailureMessage)
            }
            exit 1
          }

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-${{ github.sha }}
          path: pester-*.xml
          if-no-files-found: ignore

      - name: Coverage report (report-only baseline)
        if: always()
        shell: powershell
        run: |
          Get-Module -Name Pester | Remove-Module -Force -ErrorAction SilentlyContinue
          Import-Module -Name Pester -RequiredVersion $env:PESTER_VERSION -Force
          ./scripts/coverage.ps1 -OutFile coverage-summary.txt

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage-summary.txt
          if-no-files-found: ignore

  node-tests:
    name: Node dashboard assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests/dashboard.test.js
        run: node tests/dashboard.test.js

name: tests

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ps-parse-check:
    name: PowerShell parse-check (145 scripts)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse-check all .ps1 + .wprp
        shell: pwsh
        run: |
          ./scripts/test-all.ps1

  pester:
    name: Pester (768 tests, PS 5.1 surface)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install + force-load Pester 3.4.0 (project surface uses v3 syntax)
        shell: powershell
        run: |
          # Runner has Pester 5.x preinstalled — that uses different syntax (Should -Be).
          # Project surface uses v3 syntax (Should Be). Must explicitly install + import v3.
          Install-Module -Name Pester -RequiredVersion 3.4.0 -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber
          Get-Module -ListAvailable -Name Pester | Format-Table Name, Version

      - name: Run tests/ suite (Windows PowerShell 5.1)
        shell: powershell
        run: |
          # Force-load v3 explicitly; any pre-loaded v5 must be removed first.
          Get-Module -Name Pester | Remove-Module -Force -ErrorAction SilentlyContinue
          Import-Module -Name Pester -RequiredVersion 3.4.0 -Force
          $loaded = Get-Module -Name Pester
          Write-Host ("Loaded Pester version: {0}" -f $loaded.Version)
          if ($loaded.Version.Major -ne 3) { throw "Wrong Pester version loaded: $($loaded.Version)" }

          $r = Invoke-Pester -Path tests -PassThru -Quiet
          Write-Host ("Passed: {0} / Failed: {1} / Skipped: {2} / Total: {3}" -f $r.PassedCount, $r.FailedCount, $r.SkippedCount, $r.TotalCount)
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: Run spike Pester (if branch carries spike/)
        shell: powershell
        run: |
          if (Test-Path 'spike/tests') {
            Get-Module -Name Pester | Remove-Module -Force -ErrorAction SilentlyContinue
            Import-Module -Name Pester -RequiredVersion 3.4.0 -Force
            $r = Invoke-Pester -Path spike/tests -PassThru -Quiet
            Write-Host ("Spike Passed: {0} / Failed: {1} / Total: {2}" -f $r.PassedCount, $r.FailedCount, $r.TotalCount)
            if ($r.FailedCount -gt 0) { exit 1 }
          } else {
            Write-Host 'spike/ not present on this ref — skipping spike Pester'
          }

  node-tests:
    name: Node dashboard assertions (47 tests)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests/dashboard.test.js
        run: node tests/dashboard.test.js
